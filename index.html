   HISAAB  ·  Sheet Bridge v2  (Google Apps Script)
   ---------------------------------------------------------------------
   Your Google Sheet IS the database. This script is the only door.

   - Race-safe balance: LockService serialises writes, so two devices

     rebuild so balances stay truthful.

var TAB      = 'Entries';
// v2 adds the "Account" column (PAPA / MUMMY / DIDI / ME / custom names)
var HEADERS  = ['Date & Time','Type','Amount','Category','Note','Balance','Account','Entry ID'];
var DEFAULT_KEY = 'HISAAB-SETUP-MODE';

function doPost(e) {
  var p = {};
  try { p = JSON.parse(e.postData.contents || '{}'); } catch (err) {}
  return route_(p);
}

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (!p.action) {
    try {
      return HtmlService.createHtmlOutputFromFile('App')
        .setTitle('Hisaab')
        .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
    } catch (err) {
      return out_({ ok: true, app: 'Hisaab Sheet bridge v3', hint: 'POST entries here from the Hisaab app' });
    }
  }
  return route_(p);
}

function route_(p) {
  var props = PropertiesService.getScriptProperties();
  var currentSecret = props.getProperty('HISAAB_SECRET') || DEFAULT_KEY;
  var providedSecret = String(p.secret || '');

  // Special Action: Set new secret key (only works if you know the CURRENT key)
  if (p.action === 'set_secret') {
    if (providedSecret !== currentSecret) return out_({ ok: false, error: 'bad-key' });
    var newSecret = String(p.newSecret || '').trim();
    if (newSecret.length < 4) return out_({ ok: false, error: 'too-short' });
    props.setProperty('HISAAB_SECRET', newSecret);
    return out_({ ok: true, status: 'secret-updated' });
  }

  // All other actions require the correct secret key
  if (providedSecret !== currentSecret) return out_({ ok: false, error: 'bad-key' });

  var lock = LockService.getScriptLock();
  lock.waitLock(30000);

  try {
    var sh = tab_();
    switch (String(p.action || 'save')) {
      case 'ping':
        return out_({ ok: true, pong: Date.now() });
      case 'list':
        return out_({ ok: true, entries: list_(sh, Number(p.since) || 0, Number(p.limit) || 500) });
      case 'repair':
        return out_({ ok: true, fixed: repairDates_(sh) });
      case 'delete':
        return out_(deleteEntry_(sh, String(p.id || '')));

        // the device is missing (rows newer than "since").

function tab_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(TAB) || ss.insertSheet(TAB);
  if (sh.getLastRow() === 0) {
    sh.appendRow(HEADERS);
    sh.setFrozenRows(1);
    styleHeader_(sh, HEADERS.length);
    sh.setColumnWidth(1, 170);
    sh.setColumnWidth(5, 200);
  } else {

  }

  var cols = cols_(sh);

  if (cols['Account']) sh.unhideColumns && sh.showColumns(cols['Account']);

}

// Upgrade a v1 sheet (7 columns, ID last) to v2 by inserting "Account".

  var head = sh.getRange(1, 1, 1, Math.max(sh.getLastColumn(), 7)).getValues()[0];
  var hasAccount = false;
  for (var i = 0; i < head.length; i++) if (head[i] === 'Account') hasAccount = true;
  if (!hasAccount && head[6] === 'Entry ID') {
    sh.insertColumnBefore(7);
    sh.getRange(1, 7).setValue('Account');
    styleHeader_(sh, 8);
  }

  var head = sh.getRange(1, 1, 1, HEADERS.length).getValues()[0];
  var m = {};
  for (var i = 0; i < head.length; i++) if (head[i]) m[String(head[i])] = i + 1;

  sh.deleteRow(known[id]);
  rebuild_(sh);
  return { ok: true, status: 'deleted' };

function rebuild_(sh) {
  var n = sh.getLastRow();
  if (n < 2) return;
  var data = sh.getRange(2, 1, n - 1, HEADERS.length).getValues();
  data.sort(function (a, b) { return new Date(a[0]).getTime() - new Date(b[0]).getTime(); });

  for (var i = 0; i < data.length; i++) {

  }
  sh.getRange(2, 1, data.length, HEADERS.length).setValues(data);
  sh.getRange(2, 1, data.length, 1).setNumberFormat('dd/mm/yyyy hh:mm AM/PM');

  var known = idMap_(sh);
  var balC = cols_(sh)['Balance'] || 6;
  return known[id] ? Number(sh.getRange(known[id], balC).getValue()) || 0 : 0;

  var n = sh.getLastRow();
  if (n < 2) return [];
  var start, count;
  if (since > 0) { start = 2; count = n - 1; }                     // full scan for delta
  else { start = Math.max(2, n - limit + 1); count = n - start + 1; }
  var rows = sh.getRange(start, 1, count, HEADERS.length).getValues();
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var ts = new Date(r[0]).getTime();
    if (since > 0 && !(ts > since)) continue;
    out.push({
      ts: ts,
      type: String(r[1]).toLowerCase(),
      amount: Math.abs(Number(r[2])) || 0,
      category: String(r[3] || 'Other'),
      note: String(r[4] || ''),
      balance: Number(r[5]) || 0,
      account: String(r[6] || ''),
      id: String(r[7])
    });
    if (since > 0 && out.length >= limit) break;
  }
  return out;
}

// ONE-CLICK REPAIR: rewrite every date cell as 12-hour AM/PM (Indian format).
function repairDates_(sh) {
  var n = sh.getLastRow();
  if (n < 2) return 0;
  var rng = sh.getRange(2, 1, n - 1, 1);
  var vals = rng.getValues(), fixed = 0;
  for (var i = 0; i < vals.length; i++) {
    var d = (vals[i][0] instanceof Date) ? vals[i][0] : new Date(vals[i][0]);
    if (!isNaN(d.getTime())) { vals[i][0] = d; fixed++; }
  }
  rng.setValues(vals);
  rng.setNumberFormat('dd/mm/yyyy hh:mm AM/PM');
  return fixed;
}

function out_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
