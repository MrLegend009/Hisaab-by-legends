   HISAAB  ·  Sheet Bridge v2  (Google Apps Script)
   ---------------------------------------------------------------------
   Your Google Sheet IS the database. This script is the only door.

   SETUP (2 minutes, once, free forever):
   1. Create a blank Google Sheet (name it anything, e.g. "My Hisaab").
   2. Menu: Extensions -> Apps Script.  Delete any code there.
   3. Paste this whole file EXACTLY as it is. Do NOT change any code.
   4. Deploy -> New deployment -> type "Web app":
        Execute as:        Me
        Who has access:    Anyone
   5. Copy the Web app URL into Hisaab -> Settings -> Google Sheet.
   6. The app will automatically ask you to create a 5-digit PIN to secure
      your Sheet. You never have to look at this code again.

   HARDENING (optional): turning ON 2-Step Verification protects the
   Google account itself. Strictest mode: choose access "Only myself"
   and serve the app from this script — add an HTML file named "App",
   paste Hisaab's single-file app HTML (Settings -> Download app HTML),
   redeploy, then open your /exec URL. Now only YOUR Google login can
   even load the page.

   GUARANTEES implemented here:
   - Verified saves: the sheet confirms every write before the app
     says "Saved".
   - Exactly-once: every entry carries a unique Entry ID; a resent
     entry (network retry, double tap) is skipped as "duplicate".
   - Race-safe balance: LockService serialises writes, so two devices
     saving at the same moment queue up and the Balance column never
     corrupts. Out-of-order (offline) entries trigger a full passbook
     rebuild so balances stay truthful.
   - True time: the app sends the real moment of entry (epoch ms),
     so offline entries keep their own time.
   - One-round-trip sync: "sync" pushes your new entries AND returns
     everything newer than your device in a single call.
   ===================================================================== */

var TAB      = 'Entries';
// v2 adds the "Account" column (PAPA / MUMMY / DIDI / ME / custom names)
var HEADERS  = ['Date & Time','Type','Amount','Category','Note','Balance','Account','Entry ID'];
var DEFAULT_KEY = 'HISAAB-SETUP-MODE';

function doPost(e) {
  var p = {};
  try { p = JSON.parse(e.postData.contents || '{}'); } catch (err) {}
  return route_(p);
}

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (!p.action) {
    try {
      return HtmlService.createHtmlOutputFromFile('App')
        .setTitle('Hisaab')
        .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
    } catch (err) {
      return out_({ ok: true, app: 'Hisaab Sheet bridge v3', hint: 'POST entries here from the Hisaab app' });
    }
  }
  return route_(p);
}

function route_(p) {
  var props = PropertiesService.getScriptProperties();
  var currentSecret = props.getProperty('HISAAB_SECRET') || DEFAULT_KEY;
  var providedSecret = String(p.secret || '');

  // Special Action: Set new secret key (only works if you know the CURRENT key)
  if (p.action === 'set_secret') {
    if (providedSecret !== currentSecret) return out_({ ok: false, error: 'bad-key' });
    var newSecret = String(p.newSecret || '').trim();
    if (newSecret.length < 4) return out_({ ok: false, error: 'too-short' });
    props.setProperty('HISAAB_SECRET', newSecret);
    return out_({ ok: true, status: 'secret-updated' });
  }

  // All other actions require the correct secret key
  if (providedSecret !== currentSecret) return out_({ ok: false, error: 'bad-key' });

  var lock = LockService.getScriptLock();
  lock.waitLock(30000);

  try {
    var sh = tab_();
    switch (String(p.action || 'save')) {
      case 'ping':
        return out_({ ok: true, pong: Date.now() });
      case 'list':
        return out_({ ok: true, entries: list_(sh, Number(p.since) || 0, Number(p.limit) || 500) });
      case 'repair':
        return out_({ ok: true, fixed: repairDates_(sh) });
      case 'delete':
        return out_(deleteEntry_(sh, String(p.id || '')));
      case 'sync': {
        // ONE round trip: save the device's outbox, then return everything
        // the device is missing (rows newer than "since").
        var ins = Array.isArray(p.entries) ? p.entries : [];
        var results = [];
        for (var i = 0; i < ins.length; i++) if (ins[i]) results.push(save_(sh, ins[i]));
        return out_({
          ok: true,
          results: results,
          entries: list_(sh, Number(p.since) || 0, Number(p.limit) || 400)
        });
      }
      default: {
        var arr = Array.isArray(p.entries) ? p.entries : [p.entry];
        var rs = [];
        for (var j = 0; j < arr.length; j++) if (arr[j]) rs.push(save_(sh, arr[j]));
        return out_({ ok: true, results: rs });
      }
    }
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    try { lock.releaseLock(); } catch (err) {}
  }
}

// ── sheet plumbing ──────────────────────────────────────────────────────────
function tab_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(TAB) || ss.insertSheet(TAB);
  if (sh.getLastRow() === 0) {
    sh.appendRow(HEADERS);
    sh.setFrozenRows(1);
    styleHeader_(sh, HEADERS.length);
    sh.setColumnWidth(1, 170);
    sh.setColumnWidth(5, 200);
  } else {
    upgrade_(sh);   // v1 sheets automatically gain the "Account" column
  }
  // "Entry ID" stays hidden — find it by header, never by fixed position.
  var cols = cols_(sh);
  if (cols['Entry ID']) sh.hideColumns(sh.getRange(1, cols['Entry ID']));
  if (cols['Account']) sh.unhideColumns && sh.showColumns(cols['Account']);
  return sh;
}

function styleHeader_(sh, n) {
  sh.getRange(1, 1, 1, n).setFontWeight('bold').setBackground('#0d9488').setFontColor('#ffffff');
}

// Upgrade a v1 sheet (7 columns, ID last) to v2 by inserting "Account".
function upgrade_(sh) {
  var head = sh.getRange(1, 1, 1, Math.max(sh.getLastColumn(), 7)).getValues()[0];
  var hasAccount = false;
  for (var i = 0; i < head.length; i++) if (head[i] === 'Account') hasAccount = true;
  if (!hasAccount && head[6] === 'Entry ID') {
    sh.insertColumnBefore(7);
    sh.getRange(1, 7).setValue('Account');
    styleHeader_(sh, 8);
  }
}

function cols_(sh) {
  var head = sh.getRange(1, 1, 1, HEADERS.length).getValues()[0];
  var m = {};
  for (var i = 0; i < head.length; i++) if (head[i]) m[String(head[i])] = i + 1;
  return m;
}

  var n = sh.getLastRow(), map = {}, c = cols_(sh)['Entry ID'] || 8;
  if (n < 2) return map;
  var ids = sh.getRange(2, c, n - 1, 1).getValues();
  for (var i = 0; i < ids.length; i++) map[String(ids[i][0])] = i + 2;
  return map;
}

function save_(sh, en) {
  var known = idMap_(sh);
  if (known[String(en.id)]) return { id: en.id, status: 'duplicate' };   // exactly-once

  var amt  = Math.abs(Number(en.amount)) || 0;
  var type = String(en.type) === 'Credit' || String(en.type) === 'credit' ? 'Credit' : 'Debit';
  var ts   = Number(en.ts) || Date.now();
  var d    = new Date(ts);
  var balC = cols_(sh)['Balance'] || 6;

  // passbook balance = previous balance +/- amount
  var lastRow = sh.getLastRow(), bal = 0;
  if (lastRow > 1) bal = Number(sh.getRange(lastRow, balC).getValue()) || 0;
  bal = Math.round((bal + (type === 'Debit' ? -amt : amt)) * 100) / 100;

  sh.appendRow([d, type, amt, String(en.category || 'Other'), String(en.note || ''), bal,
                String(en.account || ''), String(en.id)]);
  var r = sh.getLastRow();
  sh.getRange(r, 1).setNumberFormat('dd/mm/yyyy hh:mm AM/PM');
  sh.getRange(r, 3).setNumberFormat('#,##0.00');
  sh.getRange(r, balC).setNumberFormat('#,##0.00');

  // offline entry arriving late? rebuild the whole passbook in true time order
  var prevTs = lastRow > 1 ? new Date(sh.getRange(lastRow, 1).getValue()).getTime() : 0;
  if (lastRow > 1 && ts < prevTs) rebuild_(sh);

  return { id: en.id, status: 'saved', balance: balanceOf_(sh, String(en.id)) };
}

function deleteEntry_(sh, id) {
  var known = idMap_(sh);
  if (!known[id]) return { ok: true, status: 'not-found' };
  sh.deleteRow(known[id]);
  rebuild_(sh);
  return { ok: true, status: 'deleted' };
}

// Re-sort by true entry time + recompute the Balance column from zero.
function rebuild_(sh) {
  var n = sh.getLastRow();
  if (n < 2) return;
  var data = sh.getRange(2, 1, n - 1, HEADERS.length).getValues();
  data.sort(function (a, b) { return new Date(a[0]).getTime() - new Date(b[0]).getTime(); });
  var bal = 0;
  for (var i = 0; i < data.length; i++) {
    bal = Math.round((bal + (data[i][1] === 'Debit' ? -Number(data[i][2]) : Number(data[i][2]))) * 100) / 100;
    data[i][5] = bal;
  }
  sh.getRange(2, 1, data.length, HEADERS.length).setValues(data);
  sh.getRange(2, 1, data.length, 1).setNumberFormat('dd/mm/yyyy hh:mm AM/PM');
}

function balanceOf_(sh, id) {
  var known = idMap_(sh);
  var balC = cols_(sh)['Balance'] || 6;
  return known[id] ? Number(sh.getRange(known[id], balC).getValue()) || 0 : 0;

function list_(sh, since, limit) {
  var n = sh.getLastRow();

    out.push({
      ts: ts,
      type: String(r[1]).toLowerCase(),

// ONE-CLICK REPAIR: rewrite every date cell as 12-hour AM/PM (Indian format).
function repairDates_(sh) {
  var n = sh.getLastRow();
  if (n < 2) return 0;
  var rng = sh.getRange(2, 1, n - 1, 1);
  var vals = rng.getValues(), fixed = 0;
  for (var i = 0; i < vals.length; i++) {
    var d = (vals[i][0] instanceof Date) ? vals[i][0] : new Date(vals[i][0]);
    if (!isNaN(d.getTime())) { vals[i][0] = d; fixed++; }
  }
  rng.setValues(vals);
  rng.setNumberFormat('dd/mm/yyyy hh:mm AM/PM');
  return fixed;
}

function out_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
